[projects.items.ape]
name = "A Pathetic Epoch: Rejuvenation In Purgatory"
owner = "Team-APE-RIP"
description = "Hearts of Iron IV向けの架空歴史MODです。"
ariaLabel = "Team-APE-RIP/APEリポジトリを新しいタブで開く"

[projects.items.toolStudio]
name = "APE-HOI4-Tool-Studio"
owner = "Team-APE-RIP"
description = "Hearts of Iron IVの制作ツールをまとめるモジュール式デスクトップワークスペースです。ツールとプラグインによる構成を採用し、C++で開発されています。"
ariaLabel = "Team-APE-RIP/APE-HOI4-Tool-Studioリポジトリを新しいタブで開く"

[projects.items.rhoiScribe]
name = "RHoiScribe"
owner = "CzXieDdan"
description = "Hearts of Iron IVのMod制作に携わるエージェント向けのローカルMCPサーバーとSkillです。ローカルの参考資料と、ゲームが読み込めるファイルを生成するツールを提供します。"
ariaLabel = "czxieddan/RHoiScribeリポジトリを新しいタブで開く"

[projects.items.ahcl]
name = "Aperip Heimdall Commons License"
owner = "Aperip Daedalus Foundation"
description = "完全な対応ソースの継続的な提供、変更履歴の保存、依存関係の透明性、バージョン移行、下流への継承を重視するオープンソースライセンスです。"
ariaLabel = "AHCLの公式ライセンス一覧を新しいタブで開く"

