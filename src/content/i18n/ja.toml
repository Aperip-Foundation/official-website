[meta]
title = "Aperip Foundation"
description = "Aperipは、一つの創作プロジェクトから始まりました。今は文化の交流と発信、オープンソースへの貢献、コミュニティに向けた活動にも目を向けています。"

[loading]
label = "シーンを読み込んでいます"

[navigation]
scrollCue = "スクロールして続ける"

[intro]
name = "Aperip"
line1 = "Aperipは、A Pathetic Epoch: Rejuvenation In Purgatoryの制作から始まりました。"
line2 = "その後は、文化の交流と発信、オープンソースへの貢献、コミュニティに向けた活動にも取り組んでいます。"

[projects]
