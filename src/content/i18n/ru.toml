name = "APE-HOI4-Tool-Studio"
owner = "Team-APE-RIP"
description = "Модульное настольное рабочее пространство для инструментов создания контента Hearts of Iron IV. Основано на архитектуре инструментов и плагинов, написано на C++."
ariaLabel = "Открыть репозиторий Team-APE-RIP/APE-HOI4-Tool-Studio в новой вкладке"

[projects.items.aperipNomos]
name = "AperipNomos"
owner = "Aperip-Daedalus-Foundation"
description = "Небольшой самостоятельно размещаемый архив для публикации текстов открытых лицензий Aperip, с публичным каталогом и отдельной панелью управления. Написан на Rust."
ariaLabel = "Открыть репозиторий Aperip-Daedalus-Foundation/AperipNomos в новой вкладке"

[projects.items.rhoiScribe]
name = "RHoiScribe"
owner = "CzXieDdan"
description = "Локальный сервер MCP и Skill для агентных процессов моддинга Hearts of Iron IV. Содержит локальные справочные материалы и инструменты для создания файлов, которые читает игра."
ariaLabel = "Открыть репозиторий czxieddan/RHoiScribe в новой вкладке"

