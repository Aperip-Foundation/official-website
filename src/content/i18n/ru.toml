eyebrow = "Об Aperip"
body = "История Aperip началась с работы над A Pathetic Epoch: Rejuvenation In Purgatory. Со временем круг интересов расширился: культурный обмен и продвижение культуры, вклад в открытые проекты и работа для сообществ."

