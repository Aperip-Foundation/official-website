[projects.items.ape]
name = "A Pathetic Epoch: Rejuvenation In Purgatory"
owner = "Team-APE-RIP"
description = "Мод альтернативной истории для Hearts of Iron IV."
ariaLabel = "Открыть репозиторий Team-APE-RIP/APE в новой вкладке"

[projects.items.toolStudio]
name = "APE-HOI4-Tool-Studio"
owner = "Team-APE-RIP"
description = "Модульное настольное рабочее пространство для инструментов создания контента Hearts of Iron IV. Основано на архитектуре инструментов и плагинов, написано на C++."
ariaLabel = "Открыть репозиторий Team-APE-RIP/APE-HOI4-Tool-Studio в новой вкладке"

[projects.items.rhoiScribe]
name = "RHoiScribe"
owner = "CzXieDdan"
description = "Локальный MCP-сервер и Skill для агентных рабочих процессов в моддинге Hearts of Iron IV. Включает локальные справочные материалы и инструменты для создания файлов, которые читает игра."
ariaLabel = "Открыть репозиторий czxieddan/RHoiScribe в новой вкладке"

[projects.items.ahcl]
name = "Aperip Heimdall Commons License 1.1"
owner = "Aperip Daedalus Foundation"
description = "Открытая лицензия, в центре которой постоянный доступ к полному соответствующему исходному коду, сохранение истории изменений, прозрачность зависимостей, переход на новые версии и передача условий далее."
ariaLabel = "Открыть официальный каталог лицензий AHCL в новой вкладке"

